# A tag v* builds the release: the web app embedded, one static binary per platform packed as
# iridium-<os>-<arch>.tar.gz, the desktop app's downloads (iridium-app-*: the binary on Linux and
# Windows, Iridium.app zipped on macOS, made and signed on a Mac), SHA256SUMS, and the notes: the
# commits, then the sizes. `ir update` and the
# settings page read the latest release (internal/update).
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write # npm provenance for the dsh plugin

# The Go checks run beside the build; publish waits for both.
jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4 # the node executor and the dsh plugin under test
        with:
          node-version: 24
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: test
        run: |
          scripts/check-types.sh
          go vet ./...
          GOOS=darwin GOARCH=arm64 go vet ./...
          GOOS=windows GOARCH=amd64 go vet ./...
          go test ./...

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the notes are the commits since the last tag
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: web
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run check
          npm run build
          npm run build:app
      - name: build
        env:
          VERSION: ${{ github.ref_name }}
          IR_APP_UPDATE_KEY: ${{ secrets.IR_APP_UPDATE_KEY }}
        run: scripts/release.sh "$VERSION" dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 1

  # The macOS app: Iridium.app around the macOS binaries, signed whole (ad hoc) with codesign, and
  # the signed manifest the app updates from. A release goes out without them if this fails.
  mac:
    needs: build
    runs-on: macos-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: bundle
        env:
          VERSION: ${{ github.ref_name }}
          IR_APP_SIGN_KEY: ${{ secrets.IR_APP_SIGN_KEY }}
        run: |
          scripts/app-bundle.sh "$VERSION" dist
          mkdir dist-mac
          mv dist/iridium-app-darwin-* dist-mac/
          [ ! -f dist/update.json ] || mv dist/update.json dist/update.json.sig dist-mac/
      - uses: actions/upload-artifact@v4
        with:
          name: dist-mac
          path: dist-mac
          retention-days: 1

  publish:
    needs: [go, build, mac]
    if: ${{ !cancelled() && needs.go.result == 'success' && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: dist-mac
          path: dist
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          pre=""
          case "$VERSION" in *-*) pre="--prerelease" ;; esac
          gh release create "$VERSION" dist/*.tar.gz dist/iridium-app-* dist/ir-computer-* dist/SHA256SUMS $(ls dist/update.json dist/update.json.sig 2>/dev/null) \
            --title "$VERSION" --notes-file dist/notes.md $pre
      # The dsh plugin (plugins/dsh-remote-iridium) goes to npm at Iridium's version, so dsh's
      # 添加插件 takes it by name. Releases only. npm trusts this workflow (Trusted Publishing,
      # OIDC: id-token above), so there is no token; it needs npm 11.5.1 or later.
      - name: dsh plugin
        if: ${{ !contains(github.ref_name, '-') }}
        working-directory: plugins/dsh-remote-iridium
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          npm install -g npm@latest --no-audit --no-fund
          npm version "${VERSION#v}" --no-git-tag-version --allow-same-version
          npm publish --access public
