<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Iridium</title>
  <link rel="stylesheet" href="/gate.css">
  <script src="/login.js"></script>
</head>
<body>
  <!-- The app's own login page: the gate's card (internal/webapp/web), the server chosen in it. -->
  <main class="shell">
    <div class="card">
      <h1 class="brand">Iridium</h1>
      <section class="view">
        <div class="pick" id="pick" hidden>
          <select id="server" aria-label="服务器"></select>
          <button id="plus" class="icon" type="button" aria-label="添加服务器">+</button>
        </div>
        <form id="add" hidden novalidate>
          <input id="addr" type="text" autocomplete="url" spellcheck="false" autocapitalize="off" enterkeyhint="go" placeholder="服务器地址，如 ir.example.com" aria-label="服务器地址">
        </form>
        <button id="login" class="btn" type="button">用 Passkey 登录</button>
      </section>
      <div class="msg">
        <p id="status" class="status" role="status" aria-live="polite"></p>
      </div>
    </div>
  </main>
</body>
</html>
