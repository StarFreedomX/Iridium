<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#fdfdfd" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Iridium" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Iridium</title>
    <script src="/theme.js"></script>
  </head>
  <body>
    <!-- The desktop app puts a strip of window keys over a page that draws none of its own
         (internal/desktop/chrome.go): this page draws its own once the app has said hello, and
         says so from its first frame, or the strip came and went over each start. -->
    <i data-win-keys="page" hidden></i>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
