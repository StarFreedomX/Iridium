<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#f4f4f5" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0c0c0d" media="(prefers-color-scheme: dark)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Iridium">
  <title>Iridium</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/_ir/gate.css">
  <!-- In the head so the saved theme applies before the first paint; the UI waits for DOMContentLoaded. -->
  <script src="/_ir/gate.js"></script>
</head>
<body>
  <!-- Iridium's mark and name at the page's top left, as the app's own page has them; the form alone
       in the middle, no card (kumo, 2026-11-20). -->
  <header class="brand">
    <svg viewBox="0 0 64 64" width="28" height="28" aria-hidden="true"><rect width="64" height="64" rx="14" fill="currentColor"/><path d="M20 18h6v28h-6zM32 28h5.6v3.2c1.4-2.4 3.6-3.6 6.4-3.6v5.8c-3.8 0-6.2 1.6-6.2 6V46H32z" fill="var(--bg)"/></svg>
    <span>Iridium</span>
  </header>
  <main class="shell">
    <div class="card">

      <section id="v-wait" class="view">
        <span class="spinner" role="progressbar"></span>
      </section>

      <section id="v-login" class="view" hidden>
        <button id="login" class="btn" type="button" data-t="signIn"></button>
        <p id="setup" class="note" data-t="setup" hidden></p>
      </section>

      <section id="v-join" class="view" hidden>
        <form id="join-form" novalidate>
          <p id="adds" class="adds" hidden></p>
          <input id="name" name="name" type="text" autocomplete="off" spellcheck="false" autocapitalize="off"
                 enterkeyhint="go" maxlength="40" data-tp="namePh" aria-describedby="name-note">
          <button id="join" class="btn" type="submit" data-t="create" disabled></button>
        </form>
      </section>

      <!-- The desktop app asking to log in (applogin.go): which computer, its code, the answer. -->
      <section id="v-app" class="view" hidden>
        <p id="app-ask" class="adds"></p>
        <p id="app-code" class="code"></p>
        <div class="row">
          <button id="app-deny" class="btn ghost" type="button" data-t="deny"></button>
          <button id="app-allow" class="btn" type="button" data-t="allow"></button>
        </div>
      </section>

      <section id="v-bad" class="view" hidden>
        <p class="note" data-t="badLink"></p>
      </section>

      <!-- The desktop app allowed: a mark and two words; the tab closes itself where the browser lets it. -->
      <section id="v-done" class="view done" hidden>
        <svg viewBox="0 0 24 24" width="44" height="44" aria-hidden="true"><circle cx="12" cy="12" r="11" fill="currentColor"/><path d="M7 12.5l3.2 3.2L17 9" fill="none" stroke="var(--bg, #fff)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <p class="done-title"></p>
        <p class="note"></p>
      </section>

      <!-- One line kept under the key whatever it says (the name's problem, an error, or nothing),
           so the card never changes size. -->
      <div class="msg">
        <p id="name-note" class="note field-note" aria-live="polite"></p>
        <p id="status" class="status" role="status" aria-live="polite"></p>
      </div>
    </div>
  </main>
</body>
</html>
